# game/ 폴더를 gh-pages 브랜치로 내보내면 GitHub Pages 가 자동으로 공개합니다
# → https://410slow.github.io/kotonoha/
name: Deploy engma game to GitHub Pages

on:
  push:
    branches: [main, claude/nice-noether-slrlbi]
    paths: ['game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf game/tools game/firebase-config.example.js
          touch game/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./game
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy 균승이 개패기 to GitHub Pages"
